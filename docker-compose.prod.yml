# Production Docker Compose
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Key differences from dev:
#  - No hot-reload (--reload removed from uvicorn)
#  - Secrets loaded from environment / secret manager (not hardcoded)
#  - Frontend served by nginx (smaller, faster than `serve`)
#  - No exposed postgres/redis ports to host
#  - DB_ECHO disabled

services:
  postgres:
    ports: []                   # Do NOT expose DB port in production
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

  redis:
    ports: []                   # Do NOT expose Redis port in production
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes

  backend:
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      DB_ECHO: "false"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    environment:
      VITE_API_URL: ${API_PUBLIC_URL}